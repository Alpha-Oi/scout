<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Scout — отчёт</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 24px; background: #f7f8fa; color: #1a1a1a; }
  @media (prefers-color-scheme: dark) {
    body { background: #14161a; color: #e6e6e6; }
    .card, .finding, .group { background: #1d2027 !important; border-color: #2a2e37 !important; }
    .evidence { background: #22262e !important; color: #cfcfcf !important; }
    .proposal { background: #1f3a2a !important; }
    .proposal.missing { background: #22262e !important; }
    .group-item { background: #22262e !important; }
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: #888; font-size: 12px; margin-bottom: 20px; word-break: break-all; }
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; padding: 16px; }
  .card .num { font-size: 28px; font-weight: 600; line-height: 1; }
  .card .label { font-size: 12px; color: #888; margin-top: 6px;
                 text-transform: uppercase; letter-spacing: 0.5px; }
  .sev-critical .num { color: #c0392b; }
  .sev-high .num     { color: #e67e22; }
  .sev-medium .num   { color: #d4a017; }
  .sev-low .num      { color: #2c7a4b; }
  .filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filters.view { margin-bottom: 16px; padding-bottom: 16px;
                  border-bottom: 1px solid #e3e6ea; }
  .filter { padding: 6px 12px; border: 1px solid #d0d4d9; border-radius: 999px;
            background: #fff; cursor: pointer; font-size: 12px; user-select: none; }
  .filter.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .finding, .group { background: #fff; border: 1px solid #e3e6ea; border-left: 3px solid #ccc;
             border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; }
  .finding[data-sev="critical"], .group[data-sev="critical"] { border-left-color: #c0392b; }
  .finding[data-sev="high"],     .group[data-sev="high"]     { border-left-color: #e67e22; }
  .finding[data-sev="medium"],   .group[data-sev="medium"]   { border-left-color: #d4a017; }
  .finding[data-sev="low"],      .group[data-sev="low"]      { border-left-color: #2c7a4b; }
  .finding h3, .group h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  .finding .where { font-family: ui-monospace, "SF Mono", Consolas, monospace;
                    font-size: 12px; color: #666; }
  .finding .evidence { margin-top: 8px; font-family: ui-monospace, monospace;
                       font-size: 12px; background: #f4f5f7; padding: 8px 10px;
                       border-radius: 4px; white-space: pre-wrap; color: #444;
                       max-height: 140px; overflow: auto; }
  .finding .proposal, .group .proposal { margin-top: 8px; padding: 8px 10px;
                       background: #eaf5ee; border-radius: 4px; font-size: 13px; }
  .finding .proposal.missing, .group .proposal.missing {
                       background: #f4f5f7; color: #888; font-style: italic; }
  .badges { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px;
           background: #eef0f3; color: #555; }
  .badge.count { background: #1a1a1a; color: #fff; font-weight: 600; }
  .badge.new { background: #2c7a4b; color: #fff; font-weight: 600; }
  .badge.fixed { background: #6b7280; color: #fff; font-weight: 600; }
  .group .items { margin-top: 8px; max-height: 260px; overflow: auto; }
  .group-item { font-family: ui-monospace, monospace; font-size: 12px;
                background: #f4f5f7; padding: 4px 8px; border-radius: 4px;
                margin-bottom: 4px; color: #444; }
  .group-item .loc { color: #666; }
  .group-item .ttl { color: #333; }
  .empty { text-align: center; color: #888; padding: 40px; }
  .diff-section { margin-bottom: 24px; }
  .diff-section h2 { font-size: 15px; margin: 0 0 10px;
                     border-bottom: 1px solid #e3e6ea; padding-bottom: 6px; }
  .diff-section h2 .cnt { color: #888; font-weight: 400; margin-left: 6px; }
  .diff-section.fixed .finding h3 { text-decoration: line-through;
                                     text-decoration-color: #aaa; }
  .diff-details { margin-bottom: 12px; font-size: 12px; color: #666; }


  /* scout-search-v2 */
  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .search-box input {
    flex: 1;
    min-width: 200px;
    padding: 6px 14px;
    border: 1px solid #d0d4d9;
    border-radius: 999px;
    background: #fff;
    color: inherit;
    font-size: 12px;
    font-family: inherit;
    line-height: 1.5;
  }
  .search-box input::placeholder { color: #aaa; font-size: 12px; }
  .search-box input:focus {
    outline: none;
    border-color: #1a1a1a;
    box-shadow: 0 0 0 2px rgba(26,26,26,0.08);
  }
  .search-box .clear {
    cursor: pointer;
    padding: 6px 12px;
    color: #888;
    font-size: 12px;
    user-select: none;
    line-height: 1.5;
    border: 1px solid transparent;
    border-radius: 999px;
  }
  .search-box .clear:hover {
    color: #1a1a1a;
    background: #eef0f3;
    border-color: #eef0f3;
  }
  .search-box .hint {
    color: #aaa;
    font-size: 11px;
    padding: 6px 0;
  }
  @media (prefers-color-scheme: dark) {
    .search-box input { background: #1d2027; border-color: #2a2e37; }
    .search-box .clear:hover { background: #2a2e37; color: #e6e6e6; }
  }
</style>
</head>
<body>
  <h1>Scout — отчёт по проекту</h1>
  <div class="meta" id="meta"></div>

  <div class="summary" id="summary"></div>

    <div class="search-box">
    <input type="search" id="search" placeholder="Поиск: файл, заголовок, детектор, evidence… (/ — фокус)"
           autocomplete="off" spellcheck="false">
    <span class="hint" id="search-hint"></span>
    <span class="clear" id="search-clear" title="Очистить (Esc)">×</span>
  </div>

<div class="filters view" id="view-toggle"></div>
  <div class="filters" id="filters"></div>
  <div id="list"></div>

<script>
/*STATE-BEGIN*/
window.STATE = { run: {}, summary: { severities: {}, categories: {} }, findings: [], groups: [], diff: null };
/*STATE-END*/

const SEV_ORDER = ["critical", "high", "medium", "low"];
const CAT_LABEL = { bug: "Баг", vuln: "Уязвимость",
                    incomplete: "Недоделка", improvement: "Улучшение" };
const SEV_LABEL = { critical: "Критично", high: "Высоко",
                    medium: "Средне", low: "Низко" };

let view = "findings";   // findings | groups | diff
let filter = { severity: null, category: null, q: "" };

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function render() {
  const s = window.STATE;
  document.getElementById("meta").textContent =
    `Прогон: ${s.run.started || "—"} · ${s.run.findings_count || 0} находок · ${s.run.run_dir || ""}`;

  const sev = s.summary.severities || {};
  document.getElementById("summary").innerHTML = SEV_ORDER.map(k => `
    <div class="card sev-${k}">
      <div class="num">${sev[k] || 0}</div>
      <div class="label">${SEV_LABEL[k]}</div>
    </div>`).join("");

  const vt = document.getElementById("view-toggle");
  const nF = s.findings.length;
  const nG = (s.groups || []).length;
  const hasDiff = !!s.diff;
  const diffCnt = hasDiff ? ` (${s.diff.summary.new}+${s.diff.summary.fixed})` : "";
  vt.innerHTML =
    `<span class="filter ${view === "findings" ? "active" : ""}"
           data-view="findings">По находкам (${nF})</span>` +
    `<span class="filter ${view === "groups" ? "active" : ""}"
           data-view="groups">По кодам (${nG})</span>` +
    (hasDiff ? `<span class="filter ${view === "diff" ? "active" : ""}"
           data-view="diff">Diff${diffCnt}</span>` : "");
  vt.querySelectorAll(".filter").forEach(el => el.addEventListener("click", () => {
    view = el.dataset.view;
    render();
  }));

  const cats = s.summary.categories || {};
  const f = document.getElementById("filters");
  f.innerHTML =
    `<span class="filter ${!filter.severity && !filter.category ? "active" : ""}"
           data-kind="all">Все (${nF})</span>` +
    SEV_ORDER.filter(k => sev[k]).map(k =>
      `<span class="filter ${filter.severity === k ? "active" : ""}"
             data-kind="severity" data-val="${k}">${SEV_LABEL[k]} (${sev[k]})</span>`).join("") +
    Object.keys(cats).map(k =>
      `<span class="filter ${filter.category === k ? "active" : ""}"
             data-kind="category" data-val="${k}">${CAT_LABEL[k] || k} (${cats[k]})</span>`).join("");

  f.querySelectorAll(".filter").forEach(el => el.addEventListener("click", () => {
    const k = el.dataset.kind;
    if (k === "all") filter = { severity: null, category: null };
    else if (k === "severity") filter.severity = filter.severity === el.dataset.val ? null : el.dataset.val;
    else if (k === "category") filter.category = filter.category === el.dataset.val ? null : el.dataset.val;
    render();
  }));

  const list = document.getElementById("list");
  if (view === "groups") renderGroups(list);
  else if (view === "diff") renderDiff(list);
  else renderFindings(list);
}

function applyFilters(items) {
  let out = items;
  if (filter.severity) out = out.filter(x => x.severity === filter.severity);
  if (filter.category) out = out.filter(x => x.category === filter.category);
  if (filter.q) {
    const q = filter.q.toLowerCase();
    out = out.filter(x => {
      const hay = [
        x.title, x.file, x.detector, x.evidence, x.proposal,
        x.category, x.code, x.key, x.where
      ].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    });
  }
  return out;
}

function badgesFor(x, extra) {
  const ds = x.diff_status;
  const dsBadge = ds === "new"   ? `<span class="badge new">NEW</span>` :
                  ds === "fixed" ? `<span class="badge fixed">FIXED</span>` : "";
  return [
    dsBadge,
    `<span class="badge">${CAT_LABEL[x.category] || x.category}</span>`,
    `<span class="badge">${esc(x.detector)}</span>`,
    x.risk   ? `<span class="badge">риск: ${esc(x.risk)}</span>` : "",
    x.effort ? `<span class="badge">усилие: ${esc(x.effort)}</span>` : "",
    ...(extra || []),
  ].filter(Boolean).join("");
}

function findingCard(x) {
  const prop = x.proposal
    ? `<div class="proposal"><strong>Что сделать:</strong> ${esc(x.proposal)}</div>`
    : `<div class="proposal missing">Предложение ещё не сформулировано.</div>`;
  const taskBtn = x.task_md
    ? `<button class="btn-task" onclick="copyTask(this, ${JSON.stringify(x.task_md).replace(/"/g, "&quot;")})">📋 Скопировать задачу</button>`
    : "";
  const openBtn = x.file
    ? `<a class="btn-open" href="javascript:void(0)" onclick="openInVSCode(this, ${JSON.stringify(x.file).replace(/"/g, "&quot;")}, ${x.line || 0})">🔎 Открыть в VS Code</a>`
    : "";
  return `<div class="finding" data-sev="${esc(x.severity)}">
    <h3>${esc(x.title)}</h3>
    <div class="where">${esc(x.file)}${x.line ? ":" + x.line : ""}</div>
    ${x.evidence ? `<div class="evidence">${esc(x.evidence)}</div>` : ""}
    ${prop}
    <div class="badges">${badgesFor(x)}</div>
    ${taskBtn}${openBtn}
  </div>`;
}

function renderFindings(list) {
  const items = applyFilters(window.STATE.findings);
  if (!items.length) {
    list.innerHTML = `<div class="empty">Ничего не найдено.</div>`;
    return;
  }
  list.innerHTML = items.map(findingCard).join("");
}

function getCollapsed() {
  try { return new Set(JSON.parse(localStorage.getItem("scout-collapsed") || "[]")); }
  catch (e) { return new Set(); }
}
function saveCollapsed(s) {
  try { localStorage.setItem("scout-collapsed", JSON.stringify([...s])); } catch (e) {}
}

function renderGroups(list) {
  const items = applyFilters(window.STATE.groups || []);
  if (!items.length) {
    list.innerHTML = `<div class="empty">Ничего не найдено.</div>`;
    return;
  }
  list.innerHTML = items.map(g => {
    const prop = g.proposal
      ? `<div class="proposal"><strong>Что сделать:</strong> ${esc(g.proposal)}</div>`
      : `<div class="proposal missing">Предложение ещё не сформулировано.</div>`;
    const itemsHtml = (g.items || []).map(it =>
      `<div class="group-item"><span class="loc">${esc(it.file)}${it.line ? ":" + it.line : ""}</span> · <span class="ttl">${esc(it.title)}</span></div>`
    ).join("");
    const taskBtn = g.task_md
      ? `<button class="btn-task" onclick="copyTask(this, ${JSON.stringify(g.task_md).replace(/"/g, "&quot;")})">📋 Скопировать задачу (${g.count})</button>`
      : "";
    const firstItem = (g.items && g.items[0]) || {};
    const openBtn = firstItem.file
      ? `<a class="btn-open" href="javascript:void(0)" onclick="openInVSCode(this, ${JSON.stringify(firstItem.file).replace(/"/g, "&quot;")}, ${firstItem.line || 0})">🔎 Первый файл</a>`
      : "";
    const _key = (g.key || g.code || g.title || "").toString();
    return `<div class="group" data-sev="${esc(g.severity)}" data-key="${esc(_key)}">
      <h3 onclick="toggleGroup(this)"><span class="arrow">▾</span> ${esc(g.title)}</h3>
      ${prop}
      <div class="items">${itemsHtml}</div>
      <div class="badges">${badgesFor(g, [`<span class="badge count">×${g.count}</span>`])}</div>
      ${taskBtn}${openBtn}
    </div>`;
  }).join("");
  applyCollapsed();
}

function renderDiff(list) {
  const d = window.STATE.diff;
  if (!d) { list.innerHTML = `<div class="empty">Diff недоступен.</div>`; return; }

  const newIds = new Set(d.new_ids || []);
  const sameIds = new Set(d.same_ids || []);
  const newFindings = (window.STATE.findings || []).filter(f => newIds.has(f.id));
  const sameFindings = (window.STATE.findings || []).filter(f => sameIds.has(f.id));
  const fixedFindings = (d.fixed || []).map(f => ({ ...f, diff_status: "fixed" }));

  const oldName = (d.old_run || "").split(/[\\/]/).pop();
  const newName = (d.new_run || "").split(/[\\/]/).pop();

  let html = `<div class="diff-details">Сравнение: <b>${esc(oldName)}</b> → <b>${esc(newName)}</b> · было ${d.old_count}, стало ${d.new_count}</div>`;

  const section = (title, cls, items, renderFn) => {
    if (!items.length) return "";
    return `<div class="diff-section ${cls}">
      <h2>${title}<span class="cnt">${items.length}</span></h2>
      ${items.map(renderFn).join("")}
    </div>`;
  };

  html += section("Новые", "new", newFindings, findingCard);
  html += section("Исчезли", "fixed", fixedFindings, findingCard);

  if (sameFindings.length) {
    html += `<div class="diff-section same">
      <h2>Без изменений<span class="cnt">${sameFindings.length}</span></h2>
      <div class="empty" style="padding:12px;text-align:left;">
        ${sameFindings.length} находок были и в прошлом прогоне. Переключитесь
        на «По находкам» или «По кодам», чтобы увидеть их полностью.
      </div>
    </div>`;
  }

  if (!newFindings.length && !fixedFindings.length) {
    html += `<div class="empty">Между прогонами ничего не изменилось.</div>`;
  }

  list.innerHTML = html;
}

function toggleGroup(h3) {
  const g = h3.parentElement;
  if (!g || !g.classList.contains("group")) return;
  const key = g.getAttribute("data-key") || "";
  let s;
  try { s = new Set(JSON.parse(localStorage.getItem("scout-collapsed") || "[]")); }
  catch (e) { s = new Set(); }
  if (g.classList.toggle("collapsed")) s.add(key);
  else s.delete(key);
  try { localStorage.setItem("scout-collapsed", JSON.stringify([...s])); } catch (e) {}
}

function applyCollapsed() {
  let s;
  try { s = new Set(JSON.parse(localStorage.getItem("scout-collapsed") || "[]")); }
  catch (e) { s = new Set(); }
  document.querySelectorAll(".group[data-key]").forEach(function (g) {
    const key = g.getAttribute("data-key") || "";
    if (s.has(key)) g.classList.add("collapsed");
    else g.classList.remove("collapsed");
  });
}

render();

function openInVSCode(btn, file, line) {
  const root = (window.STATE.run && window.STATE.run.project_root) || "";
  const clean = String(file).replace(/\\/g, "/").replace(/^\/+/, "");
  const full = root
    ? root.replace(/\\/g, "/").replace(/\/+$/, "") + "/" + clean
    : clean;
  const base = "vscode://file/" + full;
  const url = line && line > 0 ? base + ":" + line : base;
  window.location.href = url;
}

// --- Поиск ---
const searchInput = document.getElementById("search");
const searchHint = document.getElementById("search-hint");
const searchClear = document.getElementById("search-clear");

function updateSearchHint() {
  if (!filter.q) {
    searchHint.textContent = "";
    return;
  }
  const total = (view === "groups")
    ? (window.STATE.groups || []).length
    : (view === "diff")
      ? (window.STATE.findings || []).length
      : (window.STATE.findings || []).length;
  const shown = (window.STATE.groups ? applyFilters(view === "groups"
    ? window.STATE.groups : window.STATE.findings) : []).length;
  searchHint.textContent = shown + " / " + total;
}

searchInput.addEventListener("input", () => {
  filter.q = searchInput.value.trim();
  render();
  updateSearchHint();
});

searchClear.addEventListener("click", () => {
  searchInput.value = "";
  filter.q = "";
  render();
  updateSearchHint();
  searchInput.focus();
});

document.addEventListener("keydown", (e) => {
  const inField = document.activeElement &&
                  (document.activeElement.tagName === "INPUT" ||
                   document.activeElement.tagName === "TEXTAREA");
  if (e.key === "/" && !inField) {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  } else if (e.key === "Escape" && document.activeElement === searchInput) {
    searchInput.value = "";
    filter.q = "";
    render();
    updateSearchHint();
    searchInput.blur();
  }
});
</script>
<style>
  .btn-task { padding: 6px 12px; margin-top: 10px; border: none; border-radius: 6px;
              background: #1a1a1a; color: #fff; cursor: pointer; font-size: 12px;
              font-weight: 600; }
  .btn-task:hover { opacity: 0.85; }
  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
           background: #2c7a4b; color: #fff; padding: 10px 20px; border-radius: 8px;
           font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.2s;
           pointer-events: none; z-index: 9999; }
  #toast.show { opacity: 1; }
</style>
<div id="toast"></div>
<script>
function copyTask(btn, text) {
  const done = () => {
    const t = document.getElementById("toast");
    t.textContent = "Скопировано — вставьте в Claude Code";
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done);
  } else {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); }
    catch (e) { alert("Не удалось скопировать: " + e); }
    document.body.removeChild(ta);
  }
}
</script>

  @media (prefers-color-scheme: dark) {

</style>
<!-- scout-groups-collapse -->
<style>
  .group h3 {
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .group h3 .arrow {
    display: inline-block;
    width: 12px;
    color: #888;
    transition: transform 0.15s ease;
    font-size: 11px;
    line-height: 1;
  }
  .group.collapsed h3 .arrow {
    transform: rotate(-90deg);
  }
  .group .items {
    overflow: hidden;
    max-height: 260px;
    transition: max-height 0.2s ease;
  }
  .group.collapsed .items {
    max-height: 0 !important;
    margin-top: 0 !important;
  }
  @media (prefers-color-scheme: dark) {
    .group h3 .arrow { color: #aaa; }
  }
</style>
<script>
(function () {
  const KEY = "scout-collapsed-groups";
  const list = document.getElementById("list");
  if (!list) return;

  function getSet() {
    try {
      return new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
    } catch (e) {
      return new Set();
    }
  }

  function saveSet(s) {
    try {
      localStorage.setItem(KEY, JSON.stringify([...s]));
    } catch (e) { /* ignore */ }
  }

  function applyCollapsed() {
    const s = getSet();
    document.querySelectorAll(".group[data-key]").forEach(function (g) {
      const key = g.getAttribute("data-key") || "";
      if (s.has(key)) {
        g.classList.add("collapsed");
      } else {
        g.classList.remove("collapsed");
      }
    });
  }

  list.addEventListener("click", function (e) {
    const h3 = e.target.closest(".group > h3");
    if (!h3) return;
    const group = h3.parentElement;
    if (!group || !group.classList.contains("group")) return;
    group.classList.toggle("collapsed");
    const key = group.getAttribute("data-key") || "";
    const s = getSet();
    if (group.classList.contains("collapsed")) s.add(key);
    else s.delete(key);
    saveSet(s);
  });

  // перехватываем rerender (mode switch, search, filter)
  const obs = new MutationObserver(function () {
    applyCollapsed();
  });
  obs.observe(list, { childList: true, subtree: true });

  // первичное применение
  applyCollapsed();
})();
</script>
