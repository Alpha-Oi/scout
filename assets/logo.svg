<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-label="Scout radar">
  <!-- outer ring -->
  <circle cx="64" cy="64" r="54" stroke="#0066cc" stroke-width="4"/>
  <!-- middle ring -->
  <circle cx="64" cy="64" r="38" stroke="#0066cc" stroke-width="3.5" opacity="0.65"/>
  <!-- inner ring -->
  <circle cx="64" cy="64" r="22" stroke="#0066cc" stroke-width="3" opacity="0.4"/>
  <!-- center dot -->
  <circle cx="64" cy="64" r="6.5" fill="#0066cc"/>
  <!-- sweep line -->
  <line x1="64" y1="64" x2="102" y2="26" stroke="#0066cc" stroke-width="5" stroke-linecap="round"/>
  <!-- contact blip -->
  <circle cx="92" cy="34" r="5.5" fill="#0066cc"/>
</svg>
