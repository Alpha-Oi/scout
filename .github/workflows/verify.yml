name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify skill integrity
        run: python scripts/verify-skill.py

      - name: Check Python syntax of tools
        run: |
          python -m compileall -q tools scripts
          echo "compile OK"
