name: scout-self-scan

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "phases/**"
      - "SKILL.md"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install detectors
        run: python tools/doctor.py --yes

      - name: Verify integrity
        run: python scripts/verify-skill.py

      - name: Run Scout
        run: python tools/scan.py . --out reports

      - name: Show summary
        run: |
          latest=$(ls -1dt reports/*/ | head -1)
          echo "## Scout self-scan" >> $GITHUB_STEP_SUMMARY
          python -c "
import json, sys
from collections import Counter
d = json.load(open('$latest/findings.json'))
c = Counter(f['severity'] for f in d)
for k in ('critical', 'high', 'medium', 'low'):
    print(f'- {k}: {c.get(k, 0)}')
" >> $GITHUB_STEP_SUMMARY

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: scout-report
          path: reports/
          retention-days: 30
