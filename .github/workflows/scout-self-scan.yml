name: scout-self-scan

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "phases/**"
      - "SKILL.md"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install uv
        run: python -m pip install uv

      - name: Install detectors
        run: python tools/doctor.py --yes

      - name: Verify integrity
        run: python scripts/verify-skill.py

      - name: Run Scout
        run: python tools/scan.py . --out reports

      - name: Show summary
        run: python tools/summary.py >> $GITHUB_STEP_SUMMARY

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: scout-report
          path: reports/
          retention-days: 30
